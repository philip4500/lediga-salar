<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#f2f2f7,#000);
  --card:light-dark(#fff,#1c1c1e);
  --ink:light-dark(#000,#fff);
  --sec:light-dark(rgba(60,60,67,.6),rgba(235,235,245,.6));
  --sep:light-dark(rgba(60,60,67,.16),rgba(84,84,88,.55));
  --fill:light-dark(rgba(120,120,128,.12),rgba(120,120,128,.24));
  --green:light-dark(#34c759,#30d158);
  --red:light-dark(#ff3b30,#ff453a);
  --redbg:light-dark(rgba(255,59,48,.14),rgba(255,69,58,.24));
  --orange:light-dark(#ff9500,#ff9f0a);
  --orbg:light-dark(rgba(255,149,0,.16),rgba(255,159,10,.24));
  --blue:light-dark(#007aff,#0a84ff);
  --seg:light-dark(#fff,#636366);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.01em;transition:background .25s,color .25s}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px,env(safe-area-inset-left))}
.layout{display:grid;gap:28px;grid-template-areas:"head" "list" "side"}
.head{grid-area:head}.listw{grid-area:list}.side{grid-area:side;display:grid;gap:28px;align-content:start}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.date{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.02em}
h1{font:700 34px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:.01em;margin:2px 0 0}
.icon{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);font-size:19px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon:active{opacity:.5}
.icon.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.nav{display:flex;align-items:center;gap:8px;margin:20px 0 14px}
.seg{flex:1;display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:500 13px/1 inherit;font-family:inherit;padding:8px 4px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--seg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.hero{background:var(--card);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.ring{width:54px;height:54px;flex:none}
.ring circle{transition:stroke-dasharray .5s}
.hero b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.hero span{font-size:15px;color:var(--sec)}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 7px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.02em}
.hd small{text-transform:none;letter-spacing:0;font-size:13px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:12px 16px;cursor:pointer;position:relative}
.row+.row::before,.axt+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill)}
.l1{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.dot.busy{background:var(--red)}.dot.soon{background:var(--orange)}
.nm{font-weight:600;flex:1}
.st{font-size:15px;color:var(--sec);white-space:nowrap}
.chev{color:var(--sec);opacity:.5;font-size:15px;transition:transform .2s}
.row.open .chev{transform:rotate(90deg)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--fill);margin:10px 0 0 20px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--red);opacity:.85;font-style:normal}
.bar i.ex{background:var(--orange)}
.bar i span{display:none}
.bar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--blue);border-radius:1px;z-index:2}
.axis{position:relative;height:22px;margin:0 16px 0 36px;font-size:11px;color:var(--sec);font-variant-numeric:tabular-nums}
.axis span{position:absolute;top:6px;transform:translateX(-50%)}
.axt{display:none}
.det{display:none;margin:10px 0 2px 20px;font-size:15px}
.row.open .det{display:block}
.det div{display:flex;gap:12px;padding:6px 0;border-top:.5px solid var(--sep)}
.det time{width:96px;flex:none;color:var(--sec);font-variant-numeric:tabular-nums}
.det p{margin:0}.det p small{display:block;color:var(--sec);font-size:13px}
.empty{color:var(--sec);padding:6px 0;margin:0}
.foot{font-size:13px;color:var(--sec);padding:8px 16px 0}
.err{background:var(--card);color:var(--red);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:15px;display:none}
.set{padding:4px 16px}
.set label{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;font-size:15px}
.set label+label{border-top:.5px solid var(--sep)}
.set .seg{flex:0 1 230px}
.wid summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;font-size:17px}
.wid summary::-webkit-details-marker{display:none}
.wid[open] summary .chev{transform:rotate(90deg)}
.wbody{padding:0 16px 16px;border-top:.5px solid var(--sep)}
.wid .lead{color:var(--sec);margin:12px 0 14px}
.wid h3{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.02em;margin:16px 0 4px}
.wid ol{margin:0;padding-left:20px;font-size:15px}.wid li{margin:5px 0}
.wid p{font-size:15px;margin:0 0 6px}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:10px;background:var(--fill);color:var(--blue);font:600 15px/1 inherit;font-family:inherit;padding:12px;cursor:pointer}
.btn:active{opacity:.6}
a{color:var(--blue);text-decoration:none}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);padding:1px 5px;border-radius:5px}

/* Desktop */
@media (min-width:920px){
  main{max-width:1240px;padding:44px 40px 56px}
  .layout{grid-template-columns:330px minmax(0,1fr);grid-template-areas:"head list" "side list";column-gap:36px;row-gap:28px;align-items:start}
  .row{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:center;column-gap:20px;padding:10px 20px}
  .row+.row::before,.axt+.row::before{left:20px}
  .l1{flex-wrap:wrap;row-gap:2px}
  .l1 .chev{display:none}
  .st{font-size:13px;flex-basis:100%;margin-left:20px}
  .bar{height:30px;margin:0;border-radius:7px;background-color:var(--fill);background-image:linear-gradient(to right,var(--sep) 1px,transparent 1px);background-size:calc(100%/15) 100%}
  .bar i{top:3px;bottom:3px;border-radius:5px;background:var(--redbg);opacity:1;box-shadow:inset 3px 0 0 var(--red);overflow:hidden}
  .bar i.ex{background:var(--orbg);box-shadow:inset 3px 0 0 var(--orange)}
  .bar i span{display:block;font-size:12px;line-height:24px;padding:0 6px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .bar .now{top:0;bottom:0}
  .det{grid-column:2;margin:10px 0 2px}
  .axis{display:none}
  .axt{display:grid;grid-template-columns:230px minmax(0,1fr);column-gap:20px;padding:12px 20px 6px;font-size:11px;color:var(--sec)}
  .axt .axis{display:block;margin:0;height:14px}
  .axt .axis span{top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div class="head">

<script>
{
const ROOMS=[["Bifrost","264060.195"],["Vanheim","990784.195"],["Jotunheim","990783.195"],["Gimle","660753.195"],["Valhall","267189.195"],["Glase","660756.195"],["Alfheim","264001.195"]];
const START=7,END=22,SPAN=(END-START)*60;
const T={
sv:{title:"Datorsalar",rooms:"Salar",settings:"Inställningar",appearance:"Utseende",language:"Språk",auto:"Auto",light:"Ljust",dark:"Mörkt",
 today:"Idag",tomorrow:"Imorgon",days:["sön","mån","tis","ons","tor","fre","lör"],updated:"Uppdaterad ",loading:"Hämtar schema…",
 err:"Kunde inte hämta schemat från TimeEdit. Försök igen om en stund.",
 freeNow:(f,n)=>f+" av "+n+" lediga nu",freeDay:(f,n)=>f+" av "+n+" helt lediga",soonHint:"Orange prick = bokas inom 30 min",allBusy:"Alla salar är bokade just nu",dayHint:"utan bokningar den dagen",
 freeUntil:"Ledig till ",freeFrom:"Ledig från ",freeRest:"Ledig resten av dagen",busyRest:"Bokad resten av dagen",freeAll:"Ledig hela dagen",nb:n=>n+(n>1?" bokningar":" bokning"),none:"Inga bokningar.",booking:"Bokning",
 foot:"Tryck på en sal för att se bokningarna. Orange = tentamen. Data från TimeEdit, uppdateras var 5:e minut.",
 widget:"Widget för hemskärmen",lead:"Visa salarna direkt på hemskärmen eller skrivbordet.",copy:"Kopiera widget-kod",copied:"Kopierad ✓",
 steps:'<li>Widgeten körs i appen Scriptable (gratis i App Store).</li><li>Kopiera koden nedan, öppna Scriptable, tryck + och klistra in. Döp skriptet till Datorsalar.</li><li>Lägg till en Scriptable-widget på hemskärmen, håll in den → Redigera → välj skriptet Datorsalar. Skriv <code>en</code> under Parameter för engelska.</li>',
 mac1:"Med macOS Sonoma eller senare kan iPhone-widgeten visas på Macens skrivbord. Högerklicka på skrivbordet → Redigera widgetar → välj din iPhone → Scriptable. Kräver samma Apple-ID och att iPhonen är i närheten.",
 mac2:"Som app: öppna sidan i Safari → Arkiv → Lägg till i Dock.",
 privacy:"Anonym besöksstatistik via GoatCounter, utan cookies.",
 refresh:"Uppdatera",prev:"Föregående dag",next:"Nästa dag",locale:"sv-SE"},
en:{title:"Computer labs",rooms:"Rooms",settings:"Settings",appearance:"Appearance",language:"Language",auto:"Auto",light:"Light",dark:"Dark",
 today:"Today",tomorrow:"Tomorrow",days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],updated:"Updated ",loading:"Loading schedule…",
 err:"Couldn't load the schedule from TimeEdit. Try again in a moment.",
 freeNow:(f,n)=>f+" of "+n+" free now",freeDay:(f,n)=>f+" of "+n+" free all day",soonHint:"Orange dot = booked within 30 min",allBusy:"All rooms are booked right now",dayHint:"with no bookings that day",
 freeUntil:"Free until ",freeFrom:"Free from ",freeRest:"Free for the rest of the day",busyRest:"Booked for the rest of the day",freeAll:"Free all day",nb:n=>n+(n>1?" bookings":" booking"),none:"No bookings.",booking:"Booking",
 foot:"Tap a room to see its bookings. Orange = exam. Data from TimeEdit, refreshed every 5 minutes.",
 widget:"Home screen widget",lead:"Show the rooms right on your home screen or desktop.",copy:"Copy widget code",copied:"Copied ✓",
 steps:'<li>The widget runs in the app Scriptable (free on the App Store).</li><li>Copy the code below, open Scriptable, tap + and paste. Name the script Datorsalar.</li><li>Add a Scriptable widget to your home screen, long-press it → Edit → pick the script Datorsalar. Type <code>en</code> as Parameter for English.</li>',
 mac1:"On macOS Sonoma or later, the iPhone widget can sit on your Mac desktop. Right-click the desktop → Edit Widgets → pick your iPhone → Scriptable. Needs the same Apple ID and the iPhone nearby.",
 mac2:"As an app: open the page in Safari → File → Add to Dock.",
 privacy:"Anonymous visitor stats via GoatCounter, no cookies.",
 refresh:"Refresh",prev:"Previous day",next:"Next day",locale:"en-GB"}
};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||((navigator.language||"sv").toLowerCase().startsWith("sv")?"sv":"en");
let theme=store.get("theme")||"auto";
const L=()=>T[lang];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const pct=m=>Math.max(0,Math.min(100,(m-START*60)/SPAN*100));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const track=ev=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:ev,title:ev,event:true})}catch(e){}};
let day=new Date(),data=null,updated=null,open=new Set(),code="";

function segCtl(el,opts,cur,fn){
  el.innerHTML=opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(v)===String(cur)?"on":""}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.preventDefault();fn(b.dataset.v)});
}
function applyTheme(){
  if(theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme;
}
function staticText(){
  document.documentElement.lang=lang;document.title=L().title;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=L()[e.dataset.t];if(e.tagName==="OL"||e.tagName==="P")e.innerHTML=v;else e.textContent=v});
  document.querySelectorAll("[data-a]").forEach(e=>e.setAttribute("aria-label",L()[e.dataset.a]));
  segCtl($("themeSeg"),[["auto",L().auto],["light",L().light],["dark",L().dark]],theme,v=>{theme=v;store.set("theme",v);applyTheme();staticText();track("theme-"+v)});
  segCtl($("langSeg"),[["sv","Svenska"],["en","English"]],lang,v=>{lang=v;store.set("lang",v);staticText();seg();if(data)render();track("lang-"+v)});
}
function seg(){
  const t=new Date();t.setHours(0,0,0,0);
  const opts=[0,1,2].map(i=>{const d=new Date(t);d.setDate(d.getDate()+i);return d});
  segCtl($("seg"),opts.map((d,i)=>[i,i===0?L().today:i===1?L().tomorrow:L().days[d.getDay()]+" "+d.getDate()]),opts.findIndex(d=>iso(d)===iso(day)),v=>{day=opts[+v];load()});
  $("dateLbl").textContent=day.toLocaleDateString(L().locale,{weekday:"long",day:"numeric",month:"long"});
}

async function load(){
  seg();$("reload").classList.add("spin");$("err").style.display="none";
  if(!data)$("heroS").textContent=L().loading;
  const ds=iso(day),c=ds.replaceAll("-","");
  const url="https://cloud.timeedit.net/liu/web/schema/ri.json?h=t&sid=3&p="+c+".x,"+c+".x&objects="+ROOMS.map(r=>r[1]).join(",")+"&ox=0&types=0&fe=0&_="+Date.now();
  try{
    const j=await (await fetch(url)).json(),H=j.columnheaders,col=n=>H.indexOf(n);
    const by={};ROOMS.forEach(([n])=>by[n]=[]);
    for(const b of j.reservations||[]){
      const rooms=(b.columns[col("Lokal")]||"").split(",").map(s=>s.trim());
      const s=b.startdate<ds?"00:00":b.starttime,e=b.enddate>ds?"24:00":b.endtime;
      const o={s,e,typ:b.columns[col("Undervisningstyp")]||"",kurs:b.columns[col("Kurs")]||"",lar:b.columns[col("Lärare")]||"",info:b.columns[col("Information till student")]||""};
      for(const[n]of ROOMS) if(rooms.includes(n)) by[n].push(o);
    }
    for(const n in by) by[n].sort((a,b)=>mins(a.s)-mins(b.s));
    data={ds,by};updated=new Date();render();
  }catch(e){
    $("err").style.display="block";$("err").textContent=L().err;
  }
  $("reload").classList.remove("spin");
}

function status(Lst,isToday,nm){
  const t=L();
  if(!isToday) return Lst.length?{c:"busy",t:t.nb(Lst.length)}:{c:"",t:t.freeAll};
  const cur=Lst.find(b=>mins(b.s)<=nm&&nm<mins(b.e));
  if(cur){let end=mins(cur.e);for(const b of Lst)if(mins(b.s)<=end&&mins(b.e)>end)end=mins(b.e);
    return{c:"busy",t:end>=1440?t.busyRest:t.freeFrom+hm(end),free:false};}
  const up=Lst.find(b=>mins(b.s)>nm);
  if(!up) return{c:"",t:t.freeRest,free:true};
  return{c:mins(up.s)-nm<=30?"soon":"",t:t.freeUntil+up.s,free:true};
}

function render(){
  const t=L(),{ds,by}=data,now=new Date(),isToday=ds===iso(now),nm=now.getHours()*60+now.getMinutes();
  let free=0;
  const ax=[8,10,12,14,16,18,20].map(h=>`<span style="left:${pct(h*60)}%">${pad(h)}</span>`).join("");
  $("list").innerHTML=`<div class="axt"><span></span><div class="axis">${ax}</div></div>`+ROOMS.map(([n])=>{
    const Lst=by[n],st=status(Lst,isToday,nm);if(isToday?st.free:!Lst.length)free++;
    const segs=Lst.map(b=>{const l=pct(mins(b.s)),w=pct(mins(b.e))-l;return w>0?`<i class="${/tentamen/i.test(b.typ)?"ex":""}" style="left:${l}%;width:${w}%" title="${esc(b.s+"–"+b.e+" "+(b.typ||t.booking)+(b.kurs?" · "+b.kurs:""))}"><span>${esc(b.s+" "+(b.kurs||b.typ||t.booking))}</span></i>`:""}).join("");
    const nowL=isToday&&nm>=START*60&&nm<=END*60?`<span class="now" style="left:calc(${pct(nm)}% - 1px)"></span>`:"";
    const det=Lst.length?Lst.map(b=>`<div><time>${b.s}–${b.e}</time><p>${esc(b.typ||t.booking)}${b.kurs?" · "+esc(b.kurs):""}${(b.lar||b.info)?`<small>${esc([b.lar,b.info].filter(Boolean).join(" · "))}</small>`:""}</p></div>`).join(""):`<p class="empty">${t.none}</p>`;
    return `<button class="row${open.has(n)?" open":""}" data-n="${n}"><div class="l1"><span class="dot ${st.c}"></span><span class="nm">${n}</span><span class="st">${st.t}</span><span class="chev">›</span></div><div class="bar">${segs}${nowL}</div><div class="det">${det}</div></button>`;
  }).join("");
  $("list").querySelectorAll(".row").forEach(r=>r.onclick=()=>{const n=r.dataset.n;open.has(n)?open.delete(n):open.add(n);r.classList.toggle("open")});
  $("axis").innerHTML=ax;
  $("arc").setAttribute("stroke-dasharray",(free/ROOMS.length*100)+" 100");
  $("arc").setAttribute("stroke",free?"var(--green)":"var(--red)");
  $("heroT").textContent=isToday?t.freeNow(free,ROOMS.length):t.freeDay(free,ROOMS.length);
  $("heroS").textContent=isToday?(free?t.soonHint:t.allBusy):t.dayHint;
  if(updated)$("upd").textContent=t.updated+updated.toLocaleTimeString(t.locale,{hour:"2-digit",minute:"2-digit"});
}

$("prev").onclick=()=>{day=new Date(day);day.setDate(day.getDate()-1);load()};
$("next").onclick=()=>{day=new Date(day);day.setDate(day.getDate()+1);load()};
$("reload").onclick=load;
fetch("widget.js").then(r=>r.ok?r.text():"").then(x=>code=x).catch(()=>{});
$("copy").onclick=()=>{
  const b=$("copy");track("widget-copy");
  if(!code){location.href="widget.js";return}
  navigator.clipboard.writeText(code).then(()=>{b.textContent=L().copied;setTimeout(()=>b.textContent=L().copy,2000)}).catch(()=>location.href="widget.js");
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&data)load()});
setInterval(()=>{if(!document.hidden)load()},5*60*1000);
setInterval(()=>{if(data)render()},60*1000);
applyTheme();staticText();load();
}
</script>
</body>
</html>
